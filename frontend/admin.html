<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrishiMitra • Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = { content: ["./**/*.{html,js}"] };
    </script>
</head>

<body class="bg-[#0f172a] text-slate-200 min-h-screen">

    <!-- Sidebar -->
    <div class="fixed left-0 top-0 h-screen w-72 bg-slate-900 border-r border-slate-700 p-6 flex flex-col">
        <div class="flex items-center gap-3 mb-12">
            <span class="text-4xl">🌾</span>
            <h1 class="text-3xl font-bold">KrishiMitra</h1>
        </div>
        <nav class="flex-1 space-y-1">
            <a href="#"
                class="flex items-center gap-3 px-4 py-3 bg-emerald-500/10 text-emerald-400 rounded-2xl font-medium">
                <i class="fa-solid fa-users"></i> Manage Users
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-2xl transition-colors">
                <i class="fa-solid fa-chart-bar"></i> System Stats
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-white/5 rounded-2xl transition-colors">
                <i class="fa-solid fa-seedling"></i> Farms Overview
            </a>
        </nav>
    </div>

    <!-- Main -->
    <div class="ml-72">
        <header
            class="h-16 border-b border-slate-700 bg-slate-900/80 backdrop-blur-lg px-8 flex items-center justify-between">
            <h2 class="text-2xl font-semibold">Admin Dashboard</h2>
            <button onclick="logout()"
                class="bg-red-500 hover:bg-red-600 px-6 py-2 rounded-2xl text-sm font-medium">Logout</button>
        </header>

        <main class="p-8">
            <!-- KPI Cards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
                <div class="glass p-6">
                    <p class="text-slate-400">Total Users</p>
                    <p class="text-5xl font-semibold mt-2">248</p>
                </div>
                <div class="glass p-6">
                    <p class="text-slate-400">Active Farmers</p>
                    <p class="text-5xl font-semibold mt-2 text-emerald-400">142</p>
                </div>
                <div class="glass p-6">
                    <p class="text-slate-400">Total Farms</p>
                    <p class="text-5xl font-semibold mt-2">87</p>
                </div>
                <div class="glass p-6">
                    <p class="text-slate-400">Pending Approvals</p>
                    <p class="text-5xl font-semibold mt-2 text-amber-400">12</p>
                </div>
            </div>

            <!-- Tabs -->
            <div class="flex border-b border-slate-700 mb-8">
                <button onclick="showTab('users')" class="tab-btn active px-8 py-4 font-medium">Manage Users</button>
                <button onclick="showTab('stats')"
                    class="tab-btn px-8 py-4 font-medium text-slate-400 hover:text-white">System Stats</button>
            </div>

            <div id="users" class="tab-content glass p-8">
                <h3 class="text-2xl font-semibold mb-6">Users Management</h3>
                <table id="usersTable" class="w-full"></table>
            </div>

            <div id="stats" class="tab-content glass p-8 hidden">
                <h3 class="text-2xl font-semibold mb-6">Platform Analytics</h3>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="glass p-6">
                        <h4 class="mb-4">User Growth</h4>
                        <canvas id="userChart" height="140"></canvas>
                    </div>
                    <div class="glass p-6">
                        <h4 class="mb-4">Farm Distribution</h4>
                        <canvas id="farmChart" height="140"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/charts.js"></script>
    <script src="js/admin.js"></script>
    <script>
        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tab).classList.remove('hidden');
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        window.onload = () => {
            // Call your existing loadData()
            if (typeof loadData === 'function') loadData();
            initCharts();
        };
    </script>
</body>

</html>
